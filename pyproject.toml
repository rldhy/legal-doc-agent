[project]
name = "legal-doc-agent"
version = "0.1.0"
description = "Simple RAG agent for querying legal documents"
requires-python = ">=3.12"

dependencies = [
    "langchain",
    "langchain-chroma",
    "langchain-ollama",
    "langchain-text-splitters",
    "pydantic",
    "pydantic-settings",
    "pypdf"
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agent"

[project.scripts]
query-agent = "agent.main:start"
index-agent = "agent.index:main"
